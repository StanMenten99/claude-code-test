<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Battle Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Instagram Battle Arena</h1>

        <div class="setup-panel" id="setupPanel">
            <div id="playersContainer">
                <div class="player-setup" data-player="1">
                    <div class="player-header">
                        <h2>Player 1</h2>
                    </div>
                    <input type="text" class="player-username" data-player="1" placeholder="Instagram Username">
                    <div class="player-preview" data-player="1">Enter username</div>
                </div>

                <div class="player-setup" data-player="2">
                    <div class="player-header">
                        <h2>Player 2</h2>
                    </div>
                    <input type="text" class="player-username" data-player="2" placeholder="Instagram Username">
                    <div class="player-preview" data-player="2">Enter username</div>
                </div>
            </div>

            <div class="setup-controls">
                <button id="addPlayerBtn" class="btn-secondary">Add Player</button>
                <button id="startBattle" class="btn-start">Start Battle!</button>
            </div>
        </div>

        <div class="game-container" id="gameContainer" style="display: none;">
            <div class="game-header">
                <div id="playersHealthContainer" class="players-health"></div>
                <div class="timer" id="timer">60</div>
            </div>

            <canvas id="battleArena" width="800" height="800"></canvas>

            <div class="game-controls">
                <button id="pauseBtn" class="btn-control">Pause</button>
                <button id="resetBtn" class="btn-control">Reset</button>
            </div>
        </div>

        <div class="game-over" id="gameOver" style="display: none;">
            <h2>Game Over!</h2>
            <p id="winnerText"></p>
            <button id="playAgainBtn" class="btn-start">Play Again</button>
        </div>
    </div>

    <script src="instagram.js"></script>
    <script src="game.js"></script>
</body>
</html>
