<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Battle Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Instagram Battle Arena</h1>

        <div class="setup-panel" id="setupPanel">
            <div class="player-setup">
                <h2>Player 1</h2>
                <input type="text" id="player1Username" placeholder="Instagram Username">
                <div class="player-preview" id="player1Preview"></div>
            </div>

            <div class="player-setup">
                <h2>Player 2</h2>
                <input type="text" id="player2Username" placeholder="Instagram Username">
                <div class="player-preview" id="player2Preview"></div>
            </div>

            <button id="startBattle" class="btn-start">Start Battle!</button>
        </div>

        <div class="game-container" id="gameContainer" style="display: none;">
            <div class="game-header">
                <div class="player-info">
                    <div class="player-name" id="p1Name"></div>
                    <div class="health-bar">
                        <div class="health-fill" id="p1Health"></div>
                    </div>
                </div>

                <div class="timer" id="timer">60</div>

                <div class="player-info">
                    <div class="player-name" id="p2Name"></div>
                    <div class="health-bar">
                        <div class="health-fill" id="p2Health"></div>
                    </div>
                </div>
            </div>

            <canvas id="battleArena" width="800" height="800"></canvas>

            <div class="game-controls">
                <button id="pauseBtn" class="btn-control">Pause</button>
                <button id="resetBtn" class="btn-control">Reset</button>
            </div>
        </div>

        <div class="game-over" id="gameOver" style="display: none;">
            <h2>Game Over!</h2>
            <p id="winnerText"></p>
            <button id="playAgainBtn" class="btn-start">Play Again</button>
        </div>
    </div>

    <script src="instagram.js"></script>
    <script src="game.js"></script>
</body>
</html>
